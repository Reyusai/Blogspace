<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Write an Article – BlogSpace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <script>
    try { document.documentElement.dataset.theme = localStorage.getItem('blogspace_theme') || 'light'; } catch (e) {}
  </script>
</head>
<body>

  <header class="site-header">
    <nav class="nav container" aria-label="Main">
      <a href="index.html" class="logo"><span class="logo-mark">B</span>BlogSpace</a>

      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="index.html#latest">Explore</a></li>
        <li><a href="index.html#categories">Categories</a></li>
        <li class="auth-guest"><a href="login.html">Login</a></li>
        <li class="auth-user"><a href="dashboard.html">Dashboard</a></li>
      </ul>

      <div class="nav-actions">
        <button class="icon-btn" id="themeToggle" aria-label="Toggle dark mode"><i class="fa-solid fa-moon"></i></button>
        <a href="create-blog.html" class="btn btn-primary active">Write</a>
        <button class="btn btn-ghost" data-action="logout" title="Sign out"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</button>
        <button class="icon-btn menu-btn" id="menuToggle" aria-label="Open menu" aria-expanded="false" aria-controls="navLinks"><i class="fa-solid fa-bars"></i></button>
      </div>
    </nav>
  </header>

  <main class="container" style="max-width: 860px; padding-top: 40px; padding-bottom: 80px;">
    <div class="page-header" style="text-align: left; padding: 0 0 28px;">
      <h1 id="pageTitle">Write a new article</h1>
      <p id="pageSubtitle">Share your insights, lessons learned, or technical findings.</p>
    </div>

    <div class="form-card">
      <form id="blogForm">
        <div class="form-group">
          <label for="title">Title *</label>
          <input type="text" id="title" class="form-control" placeholder="What are you writing about?" required maxlength="255">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" class="form-control">
              <option value="Technology">Technology</option>
              <option value="Design">Design</option>
              <option value="Career">Career</option>
              <option value="Productivity">Productivity</option>
              <option value="Lifestyle">Lifestyle</option>
            </select>
          </div>

          <div class="form-group">
            <label for="status">Publication Status</label>
            <select id="status" class="form-control">
              <option value="published">Publish immediately</option>
              <option value="draft">Save as Draft</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="image">Featured Image URL (optional)</label>
          <input type="url" id="image" class="form-control" placeholder="https://images.unsplash.com/...">
          <span class="form-hint">Leave blank to use a default curated image.</span>
        </div>

        <div class="form-group">
          <label for="description">Summary / Excerpt</label>
          <textarea id="description" class="form-control" rows="3" placeholder="A brief 1-2 sentence overview shown on article cards..." maxlength="1000"></textarea>
        </div>

        <div class="form-group">
          <label for="content">Full Article Content</label>
          <textarea id="content" class="form-control" rows="12" placeholder="Write your full story here. Markdown and plain text supported..." style="font-family: var(--font-read); font-size: 1.05rem; min-height: 240px;"></textarea>
        </div>

        <div class="form-actions">
          <a href="dashboard.html" class="btn btn-ghost">Cancel</a>
          <button type="submit" class="btn btn-primary btn-lg" id="submitBtn">
            <i class="fa-solid fa-paper-plane"></i> <span id="btnText">Publish article</span>
          </button>
        </div>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-bottom" style="margin-top: 0;">
      © <span id="year"></span> BlogSpace. Demo project.
    </div>
  </footer>

  <div class="toast-region" id="toastRegion" aria-live="polite"></div>

  <script src="storage.js"></script>
  <script src="api.js"></script>
  <script src="main.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const editId = urlParams.get('id');

    async function initEditor() {
      if (!window.api || !window.api.isAuthenticated()) {
        showToast('Please sign in to write or edit articles.', 'info');
        setTimeout(() => { window.location.href = 'login.html'; }, 600);
        return;
      }

      if (editId) {
        document.getElementById('pageTitle').textContent = 'Edit article';
        document.getElementById('pageSubtitle').textContent = 'Update and refine your published or draft story.';
        document.getElementById('btnText').textContent = 'Save changes';

        try {
          const res = await window.api.getBlog(editId);
          const blog = res.blog;

          document.getElementById('title').value = blog.title || '';
          document.getElementById('category').value = blog.category || 'Technology';
          document.getElementById('status').value = blog.status || 'published';
          document.getElementById('image').value = blog.image || '';
          document.getElementById('description').value = blog.description || '';
          document.getElementById('content').value = blog.content || '';
        } catch (err) {
          showToast(err.message || 'Could not load blog for editing.', 'error');
          setTimeout(() => { window.location.href = 'dashboard.html'; }, 1200);
        }
      }
    }

    document.getElementById('blogForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const title = document.getElementById('title').value.trim();
      const category = document.getElementById('category').value;
      const status = document.getElementById('status').value;
      const image = document.getElementById('image').value.trim();
      const description = document.getElementById('description').value.trim();
      const content = document.getElementById('content').value;

      if (!title) {
        showToast('Title is required.', 'error');
        return;
      }

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;

      const payload = {
        title,
        category,
        status,
        image: image || undefined,
        description,
        content
      };

      try {
        if (editId) {
          await window.api.updateBlog(editId, payload);
          showToast('Article updated successfully!', 'success');
        } else {
          await window.api.createBlog(payload);
          showToast('Article created successfully!', 'success');
        }

        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 800);
      } catch (err) {
        showToast(err.message || 'Failed to save article.', 'error');
        submitBtn.disabled = false;
      }
    });

    document.addEventListener('DOMContentLoaded', initEditor);
  </script>
</body>
</html>
